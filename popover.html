<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d616 Roller</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <section class="stage" aria-live="polite">
    <div class="dice" id="dice">
      <div class="die" data-die="a">–</div>
      <div class="die marvel" data-die="m">–</div>
      <div class="die" data-die="b">–</div>
    </div>
    <div class="total" id="total">Roll to begin</div>
    <div class="outcome" id="outcome"></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="controls">
    <div class="row">
      <label for="ability">Ability score</label>
      <div class="stepper">
        <button type="button" data-step="ability" data-delta="-1" aria-label="Decrease ability score">−</button>
        <input id="ability" type="number" value="0" inputmode="numeric">
        <button type="button" data-step="ability" data-delta="1" aria-label="Increase ability score">+</button>
      </div>
    </div>

    <div class="row">
      <label for="tn">Target number</label>
      <div class="stepper">
        <button type="button" data-step="tn" data-delta="-1" aria-label="Decrease target number">−</button>
        <input id="tn" type="number" placeholder="none" inputmode="numeric">
        <button type="button" data-step="tn" data-delta="1" aria-label="Increase target number">+</button>
      </div>
    </div>
    <div class="presets" id="presets">
      <button type="button" data-tn="4">Trivial 4</button>
      <button type="button" data-tn="6">Easy 6</button>
      <button type="button" data-tn="8">Routine 8</button>
      <button type="button" data-tn="10">Challenging 10</button>
      <button type="button" data-tn="12">Difficult 12</button>
      <button type="button" data-tn="">No TN</button>
    </div>

    <div class="row">
      <label for="edges">Edges</label>
      <div class="stepper">
        <button type="button" data-step="edges" data-delta="-1" aria-label="Fewer edges">−</button>
        <input id="edges" type="number" min="0" value="0" inputmode="numeric">
        <button type="button" data-step="edges" data-delta="1" aria-label="More edges">+</button>
      </div>
    </div>
    <div class="row">
      <label for="troubles">Troubles</label>
      <div class="stepper">
        <button type="button" data-step="troubles" data-delta="-1" aria-label="Fewer troubles">−</button>
        <input id="troubles" type="number" min="0" value="0" inputmode="numeric">
        <button type="button" data-step="troubles" data-delta="1" aria-label="More troubles">+</button>
      </div>
    </div>

    <div class="row">
      <label for="label">Roll for</label>
      <input id="label" type="text" maxlength="40" placeholder="Attack, Resilience…">
    </div>
    <label class="check"><input type="checkbox" id="private"> Private roll (only I see it)</label>

    <button type="button" id="roll" class="roll-btn">Roll d616</button>
  </section>

  <section class="log">
    <header><h2>Table log</h2><button type="button" id="clear" class="link">Clear</button></header>
    <ol id="log"></ol>
  </section>
</main>
<script type="module" src="/popover.js"></script>
</body>
</html>
