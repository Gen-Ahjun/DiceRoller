<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d616 Roller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="stage" aria-live="polite">
    <div class="dice" id="dice">
      <div class="die-col">
        <button type="button" class="die" data-die="a" disabled aria-label="Die 1">–</button>
        <div class="rr"><button type="button" data-kind="edge" data-die="a" disabled>Edge</button><button type="button" data-kind="trouble" data-die="a" disabled>Trouble</button></div>
      </div>
      <div class="die-col">
        <button type="button" class="die marvel" data-die="m" disabled aria-label="Marvel die">–</button>
        <div class="rr"><button type="button" data-kind="edge" data-die="m" disabled>Edge</button><button type="button" data-kind="trouble" data-die="m" disabled>Trouble</button></div>
      </div>
      <div class="die-col">
        <button type="button" class="die" data-die="b" disabled aria-label="Die 2">–</button>
        <div class="rr"><button type="button" data-kind="edge" data-die="b" disabled>Edge</button><button type="button" data-kind="trouble" data-die="b" disabled>Trouble</button></div>
      </div>
    </div>
    <div class="total" id="total">Roll to begin</div>
    <div class="outcome" id="outcome"></div>
    <div class="damage-out" id="damage" hidden></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="actions">
    <div class="btns">
      <button type="button" id="roll" class="roll-btn alt">Roll d616</button>
      <button type="button" id="attack" class="roll-btn">Attack + damage</button>
    </div>
  </section>

  <section class="abilities" aria-labelledby="abTitle">
    <h2 id="abTitle">Ability score</h2>
    <div class="grid-head"><span>Roll</span><span></span><span>Score</span><span>Dmg ×</span></div>
    <div id="abilityRows" role="radiogroup" aria-label="Ability to roll with"></div>
    <div class="row rank-row">
      <label for="charRank">Rank</label>
      <input id="charRank" type="number" min="1" value="1" inputmode="numeric" class="narrow">
      <button type="button" id="rankToMult" class="small" title="Set every multiplier to the rank">Multipliers = rank</button>
    </div>
  </section>

  <section class="controls">



    <fieldset class="damage">
      <legend>Damage (attacks)</legend>
      <div class="row">
        <label for="dr">Target damage reduction</label>
        <div class="stepper">
          <button type="button" data-step="dr" data-delta="-1" aria-label="Decrease damage reduction">−</button>
          <input id="dr" type="number" min="0" value="0" inputmode="numeric">
          <button type="button" data-step="dr" data-delta="1" aria-label="Increase damage reduction">+</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="dbl" checked> Fantastic success doubles damage</label>
    </fieldset>

    <div class="row">
      <label for="label">Roll for</label>
      <input id="label" type="text" maxlength="40" placeholder="Attack, Resilience…">
    </div>
    <label class="check"><input type="checkbox" id="private"> Private roll (only I see it)</label>

    <div class="row">
      <label for="tn">Target number</label>
      <div class="stepper">
        <button type="button" data-step="tn" data-delta="-1" aria-label="Decrease target number">−</button>
        <input id="tn" type="number" placeholder="none" inputmode="numeric">
        <button type="button" data-step="tn" data-delta="1" aria-label="Increase target number">+</button>
      </div>
    </div>
    <div class="presets" id="presets">
      <button type="button" data-tn="4">Trivial 4</button>
      <button type="button" data-tn="6">Easy 6</button>
      <button type="button" data-tn="8">Routine 8</button>
      <button type="button" data-tn="10">Challenging 10</button>
      <button type="button" data-tn="12">Difficult 12</button>
      <button type="button" data-tn="">No TN</button>
    </div>

  </section>

  <details class="sheet" id="sheet">
    <summary>Character name, save &amp; import</summary>
    <div class="sheet-body">
      <div class="row">
        <label for="charName">Name</label>
        <input id="charName" type="text" maxlength="40" placeholder="Character name">
      </div>
      <div class="row">
        <select id="saved" aria-label="Saved characters"></select>
        <button type="button" id="loadChar" class="small">Load</button>
        <button type="button" id="saveChar" class="small">Save</button>
        <button type="button" id="delChar" class="small">Delete</button>
      </div>

      <details class="io">
        <summary>Import / export JSON</summary>
        <textarea id="json" rows="6" spellcheck="false" placeholder='{"name":"…","rank":3,"abilities":{"melee":{"score":0,"multiplier":3}, …}}'></textarea>
        <div class="row">
          <button type="button" id="exportChar" class="small">Export</button>
          <button type="button" id="importChar" class="small">Import</button>
          <label class="small file">Open file…<input type="file" id="file" accept=".json,application/json" hidden></label>
        </div>
        <div class="msg" id="ioMsg" role="status"></div>
      </details>
    </div>
  </details>

  <section class="log">
    <header><h2>Table log</h2><button type="button" id="clear" class="link">Clear</button></header>
    <ol id="log"></ol>
  </section>
</main>
<script type="module" src="popover.js"></script>
</body>
</html>
